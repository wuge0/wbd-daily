name: 🌱 WorkBuddy Daily

on:
  schedule:
    # 北京时间 07:00 / 12:00 / 23:30（GitHub cron 用 UTC，北京时间 = UTC+8）
    - cron: "0 23 * * *"     # 07:00
    - cron: "0 4 * * *"      # 12:00
    - cron: "30 15 * * *"    # 23:30
  workflow_dispatch:          # 支持手动触发

permissions:
  contents: write

concurrency:
  group: workbuddy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # mp 对话任务按真人节奏上报（每条 45s±10s），账号多时耗时更长
    env:
      TZ: Asia/Shanghai   # runner 默认 UTC：不加会把日志时间与补签日期算错一天
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      # 上游脚本的 auto_refresh() 在模块级调用 refresh_one()，而 uid_of() 定义在其后，
      # 启动预检必然 NameError（日志显示「续期失败: err」）。这里显式走 main 的 --refresh
      # 分支，此时模块已加载完毕，续期可正常完成；失败也不阻断后续任务。
      - name: Refresh tokens
        env:
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
        run: python workbuddy_daily.py --refresh || true

      # RT 是滚动令牌：续期产生的新 RT 若不回写，Secret 里那份就会一直用到过期为止。
      # 这里用独立 PAT 把新凭据写回 Secret，形成闭环；公开仓不落任何明文。
      - name: Persist rotated token
        env:
          PAT: ${{ secrets.WB_SECRET_PAT }}
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os
          try:
              store = json.load(open("wb_refresh_tokens.json", encoding="utf-8"))
          except Exception:
              print("未找到 wb_refresh_tokens.json，跳过回写")
              raise SystemExit(0)
          rows = ["%s:%s:%s" % (u, e.get("access_token", ""), e.get("refresh_token", ""))
                  for u, e in store.items() if e.get("refresh_token")]
          if not rows:
              print("无可用凭据，跳过回写")
              raise SystemExit(0)
          open("/tmp/wb_new.txt", "w", encoding="utf-8").write("\n".join(rows) + "\n")
          print("待回写账号数:", len(rows))
          PY
          NEW="$(cat /tmp/wb_new.txt 2>/dev/null || true)"
          if [ -z "$NEW" ]; then echo "凭据为空，跳过"; exit 0; fi
          if [ "$NEW" = "${WORKBUDDY_REFRESH_TOKEN:-}" ]; then echo "凭据未变化，跳过"; exit 0; fi
          if GH_TOKEN="$PAT" gh secret set WORKBUDDY_REFRESH_TOKEN -R "$GITHUB_REPOSITORY" < /tmp/wb_new.txt; then
            echo "✅ 新凭据已回写 Secret，滚动链打通"
          else
            echo "⚠️ 回写失败（PAT 权限不足或已过期），本次继续用旧凭据"
          fi
          rm -f /tmp/wb_new.txt

      - name: Restore benefit guard
        uses: actions/cache@v6
        with:
          path: workbuddy_benefit_state.json
          key: workbuddy-benefit-state-${{ github.run_id }}
          restore-keys: |
            workbuddy-benefit-state-

      - name: Run WorkBuddy
        env:
          WORKBUDDY_REFRESH_TOKEN: ${{ secrets.WORKBUDDY_REFRESH_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WORKBUDDY_TASKS: ${{ secrets.WORKBUDDY_TASKS }}
          WORKBUDDY_SKIP_TASKS: ${{ secrets.WORKBUDDY_SKIP_TASKS }}
          WORKBUDDY_MP_GAP: ${{ secrets.WORKBUDDY_MP_GAP }}
          WORKBUDDY_MAKEUP_MAX_PER_RUN: ${{ secrets.WORKBUDDY_MAKEUP_MAX_PER_RUN }}
          WORKBUDDY_ACTIVITY_CHAT_FALLBACK: ${{ secrets.WORKBUDDY_ACTIVITY_CHAT_FALLBACK }}
        run: python workbuddy_daily.py

      # ⚠️ 仅在【私有仓库】中持久化令牌/福利期次状态；公开仓库会跳过，避免 RT 泄露
      - name: Persist runtime state (private repo only)
        if: always() && github.event.repository.private == true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f wb_refresh_tokens.json 2>/dev/null || true
          git add -f workbuddy_benefit_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "运行状态无变化"
          else
            git commit -m "chore: 更新运行状态 [skip ci]"
            git push
          fi
